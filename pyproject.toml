[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcbook"
version = "0.1.0"
description = "AEC Content Manager: report packages, revisions, design-intent checks, drawing comparison, QA, RFIs and submittals for structural engineers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "reportlab>=4.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "Flask>=3.0",
    "numpy>=1.24",
    "Pillow>=10",
    "pypdfium2>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
calcbook = "calcbook.cli:main"
aec-content-manager = "calcbook.cli:main"

[tool.setuptools.packages.find]
include = ["calcbook*"]

[tool.setuptools.package-data]
"calcbook.web" = ["templates/*.html", "static/*"]
