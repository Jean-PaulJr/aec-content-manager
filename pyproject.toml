[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcbook"
version = "0.1.0"
description = "Compile, revision-track and cross-check structural calculation packages against the design basis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "reportlab>=4.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
calcbook = "calcbook.cli:main"

[tool.setuptools.packages.find]
include = ["calcbook*"]
